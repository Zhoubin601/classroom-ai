server:
  port: 8080
  servlet:
    encoding:
      charset: UTF-8
      force: true

spring:
  application:
    name: classroom-backend

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://127.0.0.1:3308/classroom_ai?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:root}
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20
      idle-timeout: 30000
      pool-name: ClassroomHikariCP
      max-lifetime: 1800000
      connection-timeout: 30000

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.MySQLDialect

  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      password: ${SPRING_DATA_REDIS_PASSWORD:}
      database: 0
      timeout: 5000ms
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 2
          max-wait: 3000ms

  servlet:
    multipart:
      max-file-size: ${CLASSROOM_MULTIPART_MAX_FILE_SIZE:200MB}
      max-request-size: ${CLASSROOM_MULTIPART_MAX_REQUEST_SIZE:220MB}

classroom:
  upload-dir: ${CLASSROOM_UPLOAD_DIR:}
  resource:
    max-file-bytes: ${CLASSROOM_RESOURCE_MAX_FILE_BYTES:104857600}
    allowed-extensions: ${CLASSROOM_RESOURCE_ALLOWED_EXTENSIONS:ppt,pptx,doc,docx,pdf}
    preview-minutes: ${CLASSROOM_RESOURCE_PREVIEW_MINUTES:5}
    soffice: ${CLASSROOM_SOFFICE:soffice}
  supervision:
    feedback-delay-hours: ${CLASSROOM_FEEDBACK_DELAY_HOURS:24}
    weights:
      attitude: ${CLASSROOM_WEIGHT_ATTITUDE:25}
      content: ${CLASSROOM_WEIGHT_CONTENT:25}
      method: ${CLASSROOM_WEIGHT_METHOD:25}
      effect: ${CLASSROOM_WEIGHT_EFFECT:25}
  face:
    similarity-threshold: 0.45
    default-dimension: 512

app:
  seed-demo: ${APP_SEED_DEMO:true}

