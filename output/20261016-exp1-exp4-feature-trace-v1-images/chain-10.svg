idth="2.5" fill="none" marker-end="url(#arrow)"/><rect x="870" y="335" width="380" height="205" rx="12" fill="white" stroke="#cbd5e1"/><text x="888" y="366" font-size="18" fill="#3730a3" font-weight="bold">4  业务校验</text><text x="888" y="397" font-size="16" fill="#243047" font-weight="normal">ResourceAccessService.java:21</text><text x="888" y="422" font-size="16" fill="#243047" font-weight="normal">canRead</text><path d="M867,435 L833,435" stroke="#6366f1" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="450" y="335" width="380" height="205" rx="12" fill="white" stroke="#cbd5e1"/><text x="468" y="366" font-size="18" fill="#3730a3" font-weight="bold">5  持久化 / 数据</text><text x="468" y="397" font-size="16" fill="#243047" font-weight="normal">CourseResourceRepository / Resourc</text><text x="468" y="422" font-size="16" fill="#243047" font-weight="normal">eAccessService → t_course_resource</text><text x="468" y="447" font-size="16" fill="#243047" font-weight="normal">、s3_resource_series</text><path d="M447,435 L413,435" stroke="#6366f1" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="30" y="335" width="380" height="205" rx="12" fill="white" stroke="#cbd5e1"/><text x="48" y="366" font-size="18" fill="#3730a3" font-weight="bold">6  状态 / 页面结果</text><text x="48" y="397" font-size="16" fill="#243047" font-weight="normal">共享true → 同室教师可发现和预览；</text><text x="48" y="422" font-size="16" fill="#243047" font-weight="normal">撤销时授权epoch变化，旧访问同时收</text><text x="48" y="447" font-size="16" fill="#243047" font-weight="normal">回。</text><text x="32" y="574" font-size="15" fill="#475569" font-weight="normal">定位口径：路径、方法名与行号来自当前exp4源码；详细接口、持久化实体和测试方法见正文。</text></g></svg>