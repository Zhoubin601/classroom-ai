<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="770" viewBox="0 0 1280 770" role="img" aria-label="实验一21条故事全景"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#6366f1"/></marker></defs><rect width="100%" height="100%" rx="20" fill="#f8fafc"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><text x="36" y="48" font-size="28" fill="#172554" font-weight="bold">从课程底座到教学改进：21 条需求，4 条业务路径</text><rect x="32" y="80" width="294" height="645" rx="14" fill="white" stroke="#cbd5e1"/><text x="50" y="116" font-size="22" fill="#4338ca" font-weight="bold">01  课程底座</text><text x="50" y="161" font-size="17" fill="#6366f1" font-weight="bold">US-01</text><text x="50" y="185" font-size="16" fill="#243047" font-weight="normal">课程建档与模板导入</text><text x="50" y="238" font-size="17" fill="#6366f1" font-weight="bold">US-02</text><text x="50" y="262" font-size="16" fill="#243047" font-weight="normal">课程内容草稿与发布</text><text x="50" y="315" font-size="17" fill="#6366f1" font-weight="bold">US-03</text><text x="50" y="339" font-size="16" fill="#243047" font-weight="normal">多教师开课与排课统筹</text><text x="50" y="392" font-size="17" fill="#6366f1" font-weight="bold">US-05</text><text x="50" y="416" font-size="16" fill="#243047" font-weight="normal">大纲与毕业要求指标关联</text><text x="50" y="469" font-size="17" fill="#6366f1" font-weight="bold">US-06</text><text x="50" y="493" font-size="16" fill="#243047" font-weight="normal">督导授权范围内组合检索</text><text x="50" y="546" font-size="17" fill="#6366f1" font-weight="bold">US-04</text><text x="50" y="570" font-size="16" fill="#243047" font-weight="normal">历史开课与累计人次</text><text x="50" y="675" font-size="14" fill="#475569" font-weight="normal">主任 → 教师 → 主任 → 督</text><text x="50" y="698" font-size="14" fill="#475569" font-weight="normal">导 → 教师</text><rect x="344" y="80" width="294" height="645" rx="14" fill="white" stroke="#cbd5e1"/><text x="362" y="116" font-size="22" fill="#4338ca" font-weight="bold">02  教学资源</text><text x="362" y="161" font-size="17" fill="#6366f1" font-weight="bold">US-07</text><text x="362" y="185" font-size="16" fill="#243047" font-weight="normal">按章节上传教学材料</text><text x="362" y="238" font-size="17" fill="#6366f1" font-weight="bold">US-08</text><text x="362" y="262" font-size="16" fill="#243047" font-weight="normal">教学环节多选标签</text><text x="362" y="315" font-size="17" fill="#6366f1" font-weight="bold">US-10</text><text x="362" y="339" font-size="16" fill="#243047" font-weight="normal">教研室共享资源检索</text><text x="362" y="392" font-size="17" fill="#6366f1" font-weight="bold">US-09</text><text x="362" y="416" font-size="16" fill="#243047" font-weight="normal">限时授权水印预览</text><text x="362" y="469" font-size="17" fill="#6366f1" font-weight="bold">US-11</text><text x="362" y="493" font-size="16" fill="#243047" font-weight="normal">资源版本与当前版控制</text><text x="362" y="546" font-size="17" fill="#6366f1" font-weight="bold">US-12</text><text x="362" y="570" font-size="16" fill="#243047" font-weight="normal">授权微格片段与元数据回</text><text x="362" y="595" font-size="16" fill="#243047" font-weight="normal">看</text><text x="362" y="675" font-size="14" fill="#475569" font-weight="normal">教师 → 同室教师/督导 → </text><text x="362" y="698" font-size="14" fill="#475569" font-weight="normal">主任 → 管理员</text><rect x="656" y="80" width="294" height="645" rx="14" fill="white" stroke="#cbd5e1"/><text x="674" y="116" font-size="22" fill="#4338ca" font-weight="bold">03  评价与改进</text><text x="674" y="161" font-size="17" fill="#6366f1" font-weight="bold">US-20</text><text x="674" y="185" font-size="16" fill="#243047" font-weight="normal">评教模板与权重版本</text><text x="674" y="238" font-size="17" fill="#6366f1" font-weight="bold">US-13</text><text x="674" y="262" font-size="16" fill="#243047" font-weight="normal">结构化听课评价</text><text x="674" y="315" font-size="17" fill="#6366f1" font-weight="bold">US-14</text><text x="674" y="339" font-size="16" fill="#243047" font-weight="normal">审核、延迟与匿名反馈</text><text x="674" y="392" font-size="17" fill="#6366f1" font-weight="bold">US-21</text><text x="674" y="416" font-size="16" fill="#243047" font-weight="normal">建议到教学行动闭环</text><text x="674" y="675" font-size="14" fill="#475569" font-weight="normal">管理员 → 督导 → 主任 → </text><text x="674" y="698" font-size="14" fill="#475569" font-weight="normal">教师</text><rect x="968" y="80" width="294" height="645" rx="14" fill="white" stroke="#cbd5e1"/><text x="986" y="116" font-size="22" fill="#4338ca" font-weight="bold">04  统计与分析</text><text x="986" y="161" font-size="17" fill="#6366f1" font-weight="bold">US-15</text><text x="986" y="185" font-size="16" fill="#243047" font-weight="normal">学期课程覆盖统计</text><text x="986" y="238" font-size="17" fill="#6366f1" font-weight="bold">US-16</text><text x="986" y="262" font-size="16" fill="#243047" font-weight="normal">低覆盖与低评价预警</text><text x="986" y="315" font-size="17" fill="#6366f1" font-weight="bold">US-17</text><text x="986" y="339" font-size="16" fill="#243047" font-weight="normal">本人评价汇总与雷达图</text><text x="986" y="392" font-size="17" fill="#6366f1" font-weight="bold">US-19</text><text x="986" y="416" font-size="16" fill="#243047" font-weight="normal">按课程类别分析问题分布</text><text x="986" y="469" font-size="17" fill="#6366f1" font-weight="bold">US-18</text><text x="986" y="493" font-size="16" fill="#243047" font-weight="normal">教学质量报表导出</text><text x="986" y="675" font-size="14" fill="#475569" font-weight="normal">督导 → 主任 → 教师 → 督</text><text x="986" y="698" font-size="14" fill="#475569" font-weight="normal">导 → 主任</text></g></svg>