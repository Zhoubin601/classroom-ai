<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="560" viewBox="0 0 1280 560" role="img" aria-label="评价与改进业务操作路径"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#6366f1"/></marker></defs><rect width="100%" height="100%" rx="20" fill="#f8fafc"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><text x="32" y="46" font-size="27" fill="#172554" font-weight="bold">路径 3｜评价与改进</text><text x="32" y="78" font-size="17" fill="#475569" font-weight="normal">管理员 → 督导 → 主任 → 教师</text><rect x="32" y="112" width="382" height="174" rx="12" fill="white" stroke="#cbd5e1"/><text x="50" y="143" font-size="18" fill="#3730a3" font-weight="bold">1  US-20 评教模板与权重版本</text><text x="50" y="174" font-size="16" fill="#243047" font-weight="normal">模板管理 → 模板草稿；新模板供后续</text><text x="50" y="199" font-size="16" fill="#243047" font-weight="normal">评价选择，核对历史评价未变化</text><path d="M417,197 L445,197" stroke="#6366f1" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="450" y="112" width="382" height="174" rx="12" fill="white" stroke="#cbd5e1"/><text x="468" y="143" font-size="18" fill="#3730a3" font-weight="bold">2  US-13 结构化听课评价</text><text x="468" y="174" font-size="16" fill="#243047" font-weight="normal">督导工作台 → 课程检索 → 目标班次 →</text><text x="468" y="199" font-size="16" fill="#243047" font-weight="normal"> 随堂评价；正式提交（待审核） → 主</text><text x="468" y="224" font-size="16" fill="#243047" font-weight="normal">任审核队列</text><path d="M835,197 L863,197" stroke="#6366f1" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="868" y="112" width="382" height="174" rx="12" fill="white" stroke="#cbd5e1"/><text x="886" y="143" font-size="18" fill="#3730a3" font-weight="bold">3  US-14 审核、延迟与匿名反馈</text><text x="886" y="174" font-size="16" fill="#243047" font-weight="normal">督导正式提交评价；到期后教师工作台</text><text x="886" y="199" font-size="16" fill="#243047" font-weight="normal"> → 教学反馈，核对身份脱敏与审核日</text><text x="886" y="224" font-size="16" fill="#243047" font-weight="normal">志</text><path d="M1240,286 L1240,306 L13,306 L13,407 L30,407" fill="none" stroke="#6366f1" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="32" y="322" width="382" height="174" rx="12" fill="white" stroke="#cbd5e1"/><text x="50" y="353" font-size="18" fill="#3730a3" font-weight="bold">4  US-21 建议到教学行动闭环</text><text x="50" y="384" font-size="16" fill="#243047" font-weight="normal">督导先暂存评价草稿；选择接受或调整</text><text x="50" y="409" font-size="16" fill="#243047" font-weight="normal">，填写行动内容和实践反馈 → 保存行</text><text x="50" y="434" font-size="16" fill="#243047" font-weight="normal">动反馈 → 查看修改历史</text><text x="32" y="540" font-size="15" fill="#475569" font-weight="normal">前提：各测试夹具相互隔离；箭头表示业务依赖与演示次序，具体写权限以角色范围和当前状态为准。</text></g></svg>