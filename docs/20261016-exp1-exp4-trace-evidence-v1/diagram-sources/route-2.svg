<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="560" viewBox="0 0 1280 560" role="img" aria-label="教学资源业务操作路径"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#6366f1"/></marker></defs><rect width="100%" height="100%" rx="20" fill="#f8fafc"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><text x="32" y="46" font-size="27" fill="#172554" font-weight="bold">路径 2｜教学资源</text><text x="32" y="78" font-size="17" fill="#475569" font-weight="normal">教师 → 同室教师/督导 → 主任 → 管理员</text><rect x="32" y="112" width="382" height="174" rx="12" fill="white" stroke="#cbd5e1"/><text x="50" y="143" font-size="18" fill="#3730a3" font-weight="bold">1  US-07 按章节上传教学材料</text><text x="50" y="174" font-size="16" fill="#243047" font-weight="normal">任课教师工作台 → 课程资料 → 上传新</text><text x="50" y="199" font-size="16" fill="#243047" font-weight="normal">课件/教案；立即挂载 → 查看资源列表</text><text x="50" y="224" font-size="16" fill="#243047" font-weight="normal">和失败提示</text><path d="M417,197 L445,197" stroke="#6366f1" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="450" y="112" width="382" height="174" rx="12" fill="white" stroke="#cbd5e1"/><text x="468" y="143" font-size="18" fill="#3730a3" font-weight="bold">2  US-08 教学环节多选标签</text><text x="468" y="174" font-size="16" fill="#243047" font-weight="normal">教师工作台 → 课程资料；分别点击单</text><text x="468" y="199" font-size="16" fill="#243047" font-weight="normal">个标签、未标注和全部，核对结果</text><path d="M835,197 L863,197" stroke="#6366f1" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="868" y="112" width="382" height="174" rx="12" fill="white" stroke="#cbd5e1"/><text x="886" y="143" font-size="18" fill="#3730a3" font-weight="bold">3  US-10 教研室共享资源检索</text><text x="886" y="174" font-size="16" fill="#243047" font-weight="normal">资源所属教师 → 课程资料 → 编辑标签</text><text x="886" y="199" font-size="16" fill="#243047" font-weight="normal">与共享 → 勾选教研室共享；资源所属</text><text x="886" y="224" font-size="16" fill="#243047" font-weight="normal">教师撤销共享，原读者刷新及重试旧票</text><text x="886" y="249" font-size="16" fill="#243047" font-weight="normal">据</text><path d="M1240,286 L1240,306 L13,306 L13,407 L30,407" fill="none" stroke="#6366f1" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="32" y="322" width="382" height="174" rx="12" fill="white" stroke="#cbd5e1"/><text x="50" y="353" font-size="18" fill="#3730a3" font-weight="bold">4  US-09 限时授权水印预览</text><text x="50" y="384" font-size="16" fill="#243047" font-weight="normal">教学督导工作台 → 课程检索 → 选择班</text><text x="50" y="409" font-size="16" fill="#243047" font-weight="normal">次；到期、权限撤销或换账号后重试旧</text><text x="50" y="434" font-size="16" fill="#243047" font-weight="normal">链接</text><path d="M417,407 L445,407" stroke="#6366f1" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="450" y="322" width="382" height="174" rx="12" fill="white" stroke="#cbd5e1"/><text x="468" y="353" font-size="18" fill="#3730a3" font-weight="bold">5  US-11 资源版本与当前版控制</text><text x="468" y="384" font-size="16" fill="#243047" font-weight="normal">统计与反馈 → 资源版本 → 刷新资源；</text><text x="468" y="409" font-size="16" fill="#243047" font-weight="normal">按固定历史ID预览，验证旧文件仍保留</text><path d="M835,407 L863,407" stroke="#6366f1" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="868" y="322" width="382" height="174" rx="12" fill="white" stroke="#cbd5e1"/><text x="886" y="353" font-size="18" fill="#3730a3" font-weight="bold">6  US-12 授权微格片段与元数据回看</text><text x="886" y="384" font-size="16" fill="#243047" font-weight="normal">微格教学视频 → 选择微格课程；回看</text><text x="886" y="409" font-size="16" fill="#243047" font-weight="normal">片段，验证拖动边界及终点自动停止</text><text x="32" y="540" font-size="15" fill="#475569" font-weight="normal">前提：各测试夹具相互隔离；箭头表示业务依赖与演示次序，具体写权限以角色范围和当前状态为准。</text></g></svg>