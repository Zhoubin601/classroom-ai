<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="560" viewBox="0 0 1280 560" role="img" aria-label="课程底座业务操作路径"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#6366f1"/></marker></defs><rect width="100%" height="100%" rx="20" fill="#f8fafc"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><text x="32" y="46" font-size="27" fill="#172554" font-weight="bold">路径 1｜课程底座</text><text x="32" y="78" font-size="17" fill="#475569" font-weight="normal">主任 → 教师 → 主任 → 督导 → 教师</text><rect x="32" y="112" width="382" height="174" rx="12" fill="white" stroke="#cbd5e1"/><text x="50" y="143" font-size="18" fill="#3730a3" font-weight="bold">1  US-01 课程建档与模板导入</text><text x="50" y="174" font-size="16" fill="#243047" font-weight="normal">教研室主任工作台 → 课程档案；确认</text><text x="50" y="199" font-size="16" fill="#243047" font-weight="normal">导入并整批入库 → 检查课程列表</text><path d="M417,197 L445,197" stroke="#6366f1" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="450" y="112" width="382" height="174" rx="12" fill="white" stroke="#cbd5e1"/><text x="468" y="143" font-size="18" fill="#3730a3" font-weight="bold">2  US-02 课程内容草稿与发布</text><text x="468" y="174" font-size="16" fill="#243047" font-weight="normal">任课教师工作台 → 当前主讲课程 → 课</text><text x="468" y="199" font-size="16" fill="#243047" font-weight="normal">程资料；再次编辑草稿，用另一读者验</text><text x="468" y="224" font-size="16" fill="#243047" font-weight="normal">证仍显示旧正式版</text><path d="M835,197 L863,197" stroke="#6366f1" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="868" y="112" width="382" height="174" rx="12" fill="white" stroke="#cbd5e1"/><text x="886" y="143" font-size="18" fill="#3730a3" font-weight="bold">3  US-03 多教师开课与排课统筹</text><text x="886" y="174" font-size="16" fill="#243047" font-weight="normal">教研室主任工作台 → 开课排课；检查</text><text x="886" y="199" font-size="16" fill="#243047" font-weight="normal">文管A447、95人样例和冲突提示</text><path d="M1240,286 L1240,306 L13,306 L13,407 L30,407" fill="none" stroke="#6366f1" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="32" y="322" width="382" height="174" rx="12" fill="white" stroke="#cbd5e1"/><text x="50" y="353" font-size="18" fill="#3730a3" font-weight="bold">4  US-05 大纲与毕业要求指标关联</text><text x="50" y="384" font-size="16" fill="#243047" font-weight="normal">主任工作台 → 指标矩阵 → 选择培养方</text><text x="50" y="409" font-size="16" fill="#243047" font-weight="normal">案专业和版本；主任审查锁定；切换历</text><text x="50" y="434" font-size="16" fill="#243047" font-weight="normal">史版本核对只读映射</text><path d="M417,407 L445,407" stroke="#6366f1" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="450" y="322" width="382" height="174" rx="12" fill="white" stroke="#cbd5e1"/><text x="468" y="353" font-size="18" fill="#3730a3" font-weight="bold">5  US-06 督导授权范围内组合检索</text><text x="468" y="384" font-size="16" fill="#243047" font-weight="normal">教学督导工作台 → 课程检索；记录样</text><text x="468" y="409" font-size="16" fill="#243047" font-weight="normal">本规模、请求次数及响应时间</text><path d="M835,407 L863,407" stroke="#6366f1" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="868" y="322" width="382" height="174" rx="12" fill="white" stroke="#cbd5e1"/><text x="886" y="353" font-size="18" fill="#3730a3" font-weight="bold">6  US-04 历史开课与累计人次</text><text x="886" y="384" font-size="16" fill="#243047" font-weight="normal">任课教师工作台 → 开课历史；归档支</text><text x="886" y="409" font-size="16" fill="#243047" font-weight="normal">线由主任在开课排课操作结课归档</text><text x="32" y="540" font-size="15" fill="#475569" font-weight="normal">前提：各测试夹具相互隔离；箭头表示业务依赖与演示次序，具体写权限以角色范围和当前状态为准。</text></g></svg>