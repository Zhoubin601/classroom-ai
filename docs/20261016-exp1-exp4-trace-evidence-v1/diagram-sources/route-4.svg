<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="560" viewBox="0 0 1280 560" role="img" aria-label="统计与分析业务操作路径"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#6366f1"/></marker></defs><rect width="100%" height="100%" rx="20" fill="#f8fafc"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><text x="32" y="46" font-size="27" fill="#172554" font-weight="bold">路径 4｜统计与分析</text><text x="32" y="78" font-size="17" fill="#475569" font-weight="normal">督导 → 主任 → 教师 → 督导 → 主任</text><rect x="32" y="112" width="382" height="174" rx="12" fill="white" stroke="#cbd5e1"/><text x="50" y="143" font-size="18" fill="#3730a3" font-weight="bold">1  US-15 学期课程覆盖统计</text><text x="50" y="174" font-size="16" fill="#243047" font-weight="normal">督导工作台 → 课程检索；排除无效班</text><text x="50" y="199" font-size="16" fill="#243047" font-weight="normal">次，比较相同课程多个班次</text><path d="M417,197 L445,197" stroke="#6366f1" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="450" y="112" width="382" height="174" rx="12" fill="white" stroke="#cbd5e1"/><text x="468" y="143" font-size="18" fill="#3730a3" font-weight="bold">2  US-16 低覆盖与低评价预警</text><text x="468" y="174" font-size="16" fill="#243047" font-weight="normal">统计与反馈 → 选择学期 → 查询；回查</text><text x="468" y="199" font-size="16" fill="#243047" font-weight="normal">相关课程与评价明细，人工复核</text><path d="M835,197 L863,197" stroke="#6366f1" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="868" y="112" width="382" height="174" rx="12" fill="white" stroke="#cbd5e1"/><text x="886" y="143" font-size="18" fill="#3730a3" font-weight="bold">3  US-17 本人评价汇总与雷达图</text><text x="886" y="174" font-size="16" fill="#243047" font-weight="normal">统计与反馈 → 学期及课程筛选 → 查询</text><text x="886" y="199" font-size="16" fill="#243047" font-weight="normal">；仅查询本人授权课程且已到期反馈</text><path d="M1240,286 L1240,306 L13,306 L13,407 L30,407" fill="none" stroke="#6366f1" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="32" y="322" width="382" height="174" rx="12" fill="white" stroke="#cbd5e1"/><text x="50" y="353" font-size="18" fill="#3730a3" font-weight="bold">4  US-19 按课程类别分析问题分布</text><text x="50" y="384" font-size="16" fill="#243047" font-weight="normal">统计与反馈 → 问题分布；核对标签、</text><text x="50" y="409" font-size="16" fill="#243047" font-weight="normal">样本数和分类版本</text><path d="M417,407 L445,407" stroke="#6366f1" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="450" y="322" width="382" height="174" rx="12" fill="white" stroke="#cbd5e1"/><text x="468" y="353" font-size="18" fill="#3730a3" font-weight="bold">5  US-18 教学质量报表导出</text><text x="468" y="384" font-size="16" fill="#243047" font-weight="normal">统计与反馈 → 质量汇总；核对导出包</text><text x="468" y="409" font-size="16" fill="#243047" font-weight="normal">含全部筛选结果，而非仅当前分页</text><text x="32" y="540" font-size="15" fill="#475569" font-weight="normal">前提：各测试夹具相互隔离；箭头表示业务依赖与演示次序，具体写权限以角色范围和当前状态为准。</text></g></svg>